<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vertical Elastic Drag Gallery</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--scale:1;--barY:0px;--galleryY:0px;}
*{box-sizing:border-box;margin:0}

body{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  font-family:system-ui,sans-serif;
  background:#f7f7f7;
  overflow:hidden;
  position: relative;
}

/*─────── FLUID OVERLAY ───────*/
.fluid-overlay {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%) scaleY(0);
  transform-origin: top center;
  width: 100vmin;
  height: 28%;
  background: black;
  z-index: 0;
  pointer-events: none;
  transition: transform 1s cubic-bezier(.25,1.6,.5,1);
}

/*─────── GALLERY ───────*/
.gallery {
  margin-top: calc(100px + var(--barY));
  transform: translateY(var(--galleryY)) scale(var(--scale));
  transition: transform 1s cubic-bezier(.25,1.6,.5,1);
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  width: 90vmin;
  max-width: 480px;
  z-index: 1;
}

.card {
  width:100%;
  padding-top:133%;
  border-radius: 32px;
  overflow:hidden;
  position:relative;
  box-shadow:0 6px 20px rgba(0,0,0,.1);
  cursor: pointer;
  transition: box-shadow 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.3s ease;
}



.card.selected {
  box-shadow:
    0 0 0 2px #bdbdbd,        /* outline */
    0 0 0 2px #bdbdbd,       /* border */
    0 6px 20px rgba(0, 0, 0, 0.15); /* depth shadow */
  transform: scale(1.015); /* slight pop */

}

.card img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.tab-content {
  margin-top: 15%;
  font-size: 1rem;
  color: #333;
  max-width: 480px;
  text-align: center;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

/*─────── DRAG BAR ───────*/
.drag-bar {
  transform:translateY(var(--barY));
  width: 100px;
  height: 8px;
  background:#d0d0d0;
  border-radius:99px;
  cursor:grab;
  touch-action:none;
  z-index:10;
  margin-top:36px;
  transition:background .25s,transform .35s cubic-bezier(.25,1.6,.5,1);
}
.drag-bar:active { background:#bdbdbd }

@keyframes squash {
  0%  {transform:translateY(var(--barY)) scaleY(1)}
  50% {transform:translateY(var(--barY)) scaleY(.9)}
  100%{transform:translateY(var(--barY)) scaleY(1)}
}
.drag-bar.boing { animation:squash .35s ease }

@media(max-width:600px) {
  .gallery { grid-template-columns:repeat(2,1fr) }
}
</style>
</head>
<body>

<!-- 💧 Fluid Ink Overlay -->
<div class="fluid-overlay" id="fluid"></div>

<!-- 📸 Gallery -->
<div class="gallery" id="gallery">
  <div class="card" tabindex="0"><img src="https://picsum.photos/id/1015/800/1066" alt=""></div>
  <div class="card" tabindex="1"><img src="https://picsum.photos/id/1016/800/1066" alt=""></div>
  <div class="card" tabindex="2"><img src="https://picsum.photos/id/1018/800/1066" alt=""></div>
  <div class="card" tabindex="3"><img src="https://picsum.photos/id/1021/800/1066" alt=""></div>
</div>



<!-- 🟫 Drag Bar -->
<div class="drag-bar" id="bar" aria-label="Drag to expand gallery"></div>

<!-- TABCONTENT -->
<div class="tab-content" id="tabContent">
  <p>Select a tab (card) to show content here.</p>
</div>

<script>
const root = document.documentElement;
const bar   = document.getElementById('bar');
const gallery = document.getElementById('gallery');
const fluid   = document.getElementById('fluid');

/* tuning */
const RANGE = 50;          // distance to fully expand
const MAX_STRETCH = 30;    // extra rubber band
const RETRACT = 10;
const MIN = 1, MAX = 1.5;

let dragging=false, startY=0, offset=0, expanded=false;

const css = (k,v)=>root.style.setProperty(k,v);

/* 🚀 NEW non‑linear squish */
function render(val){
  let d = Math.max(0,val);
  let squishY = 1;

  if(d > RANGE){
    const extra = d - RANGE;                     // overdrag pixels
    d = RANGE + Math.pow(extra,0.5);             // position easing
    d = Math.min(d, RANGE + MAX_STRETCH);

    /* tanh curve 0→1 for squishAmount */
    const t = Math.min(extra / MAX_STRETCH, 2);  // allow >1 for feel
    const squishAmount = Math.tanh(t);           // 0→~1 smoothly
    squishY = 1 - 0.03 * squishAmount;           // up to 5 % squish
  }

  /* base scale & translate */
  const pct   = Math.min(d / RANGE, 1);
  const scale = (MIN + (MAX - MIN) * pct).toFixed(3);

  css('--scale', scale);
  css('--barY',  `${d}px`);
  css('--galleryY', `${d*0.01}px`);

  /* apply combined transform */
  gallery.style.transform =
    `translateY(${d*0.01}px) scale(${scale}) scaleY(${squishY.toFixed(3)})`;

  /* fluid overlay */
  const fluidScale = d<=RANGE ? d/RANGE : 1 + ((d-RANGE)/MAX_STRETCH)*0.1;
  fluid.style.transform = `translateX(-50%) scaleY(${fluidScale.toFixed(3)})`;
}

/* spring snap, pointer events …  (unchanged below) */
function animateTo(target){
  const k = 0.12;
  (function step(){
    const diff = target - offset;
    if(Math.abs(diff) < 0.3){ offset = target; render(offset); return; }
    offset += diff * k; render(offset); requestAnimationFrame(step);
  })();
}

bar.addEventListener('pointerdown',e=>{
  dragging=true; startY=e.clientY-offset; bar.setPointerCapture(e.pointerId);
  bar.style.transition='none'; gallery.style.transition='none'; fluid.style.transition='none';
});
window.addEventListener('pointermove',e=>{
  if(!dragging) return;
  offset=e.clientY-startY; render(offset);
});
window.addEventListener('pointerup',()=>{
  if(!dragging) return; dragging=false;

  if(offset>RANGE){
    bar.classList.remove('boing'); void bar.offsetWidth; bar.classList.add('boing');
  }

  if(offset>=RANGE*0.9){ expanded=true; animateTo(RANGE); }
  else if(expanded && offset<RANGE-RETRACT){ expanded=false; animateTo(0); }
  else { animateTo(expanded?RANGE:0); }

  bar.style.transition='background 1s,transform 1s cubic-bezier(.25,1.6,.5,1)';
  gallery.style.transition='transform 1s cubic-bezier(.25,1.6,.5,1)';
  fluid.style.transition='transform 1.2s cubic-bezier(.22,1,.36,1)';
});

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', () => {
    // Optional: deselect others if only one at a time
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    
    card.classList.add('selected');
    card.focus(); // trigger :focus style too
  });
});


const cards = document.querySelectorAll('.card');
const tabContent = document.getElementById('tabContent');

cards.forEach((card, index) => {
  card.addEventListener('click', () => {
    // Deselect all
    cards.forEach(c => c.classList.remove('selected'));

    // Select this one
    card.classList.add('selected');

    // Optionally change the tab content text
    if (tabContent) {
      tabContent.innerHTML = `<p>You selected Tab ${index + 1}</p>`;
    }
  });
});

</script>

</body>
</html>
