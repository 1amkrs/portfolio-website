<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb0"/>
      <stop offset="0.55" stop-color="#ff7fa3"/>
      <stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0f5"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <path fill="url(#bg)" d="M256 16
    C 96 16 16 96 16 256 S 96 496 256 496 496 416 496 256 416 16 256 16 Z"/>
  <path fill="url(#glow)" d="M256 16
    C 96 16 16 96 16 256 S 96 496 256 496 496 416 496 256 416 16 256 16 Z"/>

  <!-- original 6-petal bloom mark -->
  <g transform="translate(256 256)">
    <g fill="url(#petal)">
      <g>
        <ellipse rx="46" ry="104" cy="-2"/>
        <ellipse rx="46" ry="104" cy="-2" transform="rotate(60)"/>
        <ellipse rx="46" ry="104" cy="-2" transform="rotate(120)"/>
      </g>
    </g>
    <circle r="42" fill="#ffffff"/>
    <circle r="42" fill="#ff7fa3" opacity="0.12"/>
  </g>
</svg>
