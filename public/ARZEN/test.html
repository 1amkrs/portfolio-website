<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Zen 3D World</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    .label {
      position: absolute;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 10px;
      pointer-events: none;
      font-size: 18px;
      z-index: 1;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

<div id="zenLabel" class="label" style="display:none; top: 40%; left: 50%;">✨ AR Zen Activated</div>
<audio id="ambientSound" src="https://cdn.pixabay.com/audio/2023/02/22/audio_6f87ae2cb3.mp3" loop></audio>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.151.3';
import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.151.3/examples/jsm/controls/PointerLockControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f0f0);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new PointerLockControls(camera, document.body);
  const audio = document.getElementById('ambientSound');

  // Start controls and audio on user click
  document.body.addEventListener('click', () => {
    controls.lock();
    audio.play().catch(e => console.log("Autoplay blocked", e));
  });

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const material = new THREE.MeshStandardMaterial({ color: 0xffffff });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), material);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const walls = [
    [new THREE.Vector3(0, 2.5, -10), 0],
    [new THREE.Vector3(-10, 2.5, 0), Math.PI / 2],
    [new THREE.Vector3(10, 2.5, 0), -Math.PI / 2],
  ];

  walls.forEach(([pos, rotY]) => {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(20, 5), material);
    wall.position.copy(pos);
    wall.rotation.y = rotY;
    scene.add(wall);
  });

  const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x00c2a8 }));
  cube.position.set(0, 0.5, 0);
  cube.castShadow = true;
  scene.add(cube);

  const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff00c3 }));
  sphere.position.set(2, 0.5, 0);
  sphere.castShadow = true;
  scene.add(sphere);

  const blob = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshStandardMaterial({ color: 0x00ffe1, transparent: true, opacity: 0.5 }));
  blob.position.set(-2, 1, 1);
  scene.add(blob);

  const keys = {};
  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  const velocity = new THREE.Vector3();
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const speed = 5 * delta;

    if (controls.isLocked) {
      if (keys['KeyW']) velocity.z = -speed;
      if (keys['KeyS']) velocity.z = speed;
      if (keys['KeyA']) velocity.x = -speed;
      if (keys['KeyD']) velocity.x = speed;

      controls.moveRight(velocity.x);
      controls.moveForward(velocity.z);

      velocity.set(0, 0, 0);
    }

    renderer.render(scene, camera);
  }

  animate();

  // Zen Label on Cube Hover
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const zenLabel = document.getElementById('zenLabel');

  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(cube);
    zenLabel.style.display = intersects.length > 0 ? 'block' : 'none';
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
