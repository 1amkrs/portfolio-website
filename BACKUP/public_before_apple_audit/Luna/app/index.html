<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fbe9ef">
<title>Luna — Wellness Onboarding</title>

<!-- Favicons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<!-- iOS add-to-home-screen -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Luna">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Luna">

<!-- PWA manifest -->
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="device">
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-bg"></div>
    <div class="splash-mark">
      <span class="petal p1"></span><span class="petal p2"></span>
      <span class="petal p3"></span><span class="petal p4"></span>
      <span class="petal p5"></span><span class="petal p6"></span>
      <span class="splash-core"></span>
    </div>
    <div class="splash-word">Luna</div>
    <div class="splash-tag">your body, understood</div>
    <div class="splash-shimmer"></div>
  </div>

  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="petal petal-1"></span>
    <span class="petal petal-2"></span>
    <span class="petal petal-3"></span>
    <span class="petal petal-4"></span>
  </div>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Go back">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress"><span class="progress-fill" id="progressFill"></span></div>
    <button class="skip-btn" id="skipBtn">Skip</button>
  </header>

  <main class="stage" id="stage"></main>

  <div class="app-shell" id="appShell" aria-hidden="true"></div>

  <div class="modal-scrim" id="permScrim" aria-hidden="true">
    <div class="perm-modal" role="dialog" aria-modal="true" aria-label="Notifications permission">
      <p class="perm-app">"Luna" Would Like to Send You Notifications</p>
      <p class="perm-desc">Notifications may include alerts, sounds, and icon badges. These can be configured in Settings.</p>
      <div class="perm-actions">
        <button class="perm-btn" id="permDeny">Don't Allow</button>
        <button class="perm-btn primary" id="permAllow">Allow</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="app.js"></script>
</body>
</html>
